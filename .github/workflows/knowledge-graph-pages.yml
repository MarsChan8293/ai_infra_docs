name: Build and Deploy AI Infra Knowledge Graph

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-infra-knowledge-graph-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTZ_DIR: /tmp/quartz
  SITE_BASE_URL: MarsChan8293.github.io/ai_infra_docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graph validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Build executable workload profile
        run: |
          python scripts/build-workload-profile.py \
            --root . \
            --input examples/workloads/qwen3.8-27b-mi300x-decode-64k.yaml \
            --output generated/executable/qwen3.8-27b-mi300x-profile.json

      - name: Build executable system requirements
        run: |
          python scripts/build-system-requirements.py \
            --root . \
            --profile generated/executable/qwen3.8-27b-mi300x-profile.json \
            --output generated/executable/qwen3.8-27b-mi300x-requirements.json \
            --markdown-output system/derived/qwen3.8-27b-mi300x-decode-64k.md

      - name: Verify executable reference case
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("generated/executable/qwen3.8-27b-mi300x-requirements.json").read_text())
          m = r["metrics"]
          assert m["memory"]["logical_weight_payload_bytes"]["value"] == 54_000_000_000
          assert m["memory"]["growing_kv_payload_bytes_per_token"]["value"] == 32_768
          assert m["memory"]["growing_kv_payload_bytes_for_context"]["value"] == 2_147_483_648
          assert m["memory"]["known_resident_lower_bound_bytes"]["value"] == 56_147_483_648
          assert m["compute"]["linear_flops_per_token_approx"]["value"] == 54_000_000_000
          assert m["communication"]["inter_accelerator_payload_bytes"]["value"] == 0
          assert any("compute throughput is unavailable" in x for x in r["unknowns"])
          print("executable reference case verified")
          PY

      - name: Build fabric performance reference
        run: |
          python scripts/build-fabric-performance.py \
            --input examples/fabric/two-stage-reference.yaml \
            --output generated/executable/fabric-reference.json \
            --markdown-output system/derived/fabric-reference.md

      - name: Verify fabric performance reference
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          r = json.loads(Path("generated/executable/fabric-reference.json").read_text())
          m = r["metrics"]

          assert r["schema_version"] == "fabric-path-v0.1"
          assert r["critical_path_bytes"] == 268_435_456
          assert len(r["stages"]) == 2

          assert math.isclose(m["nominal_path_bottleneck_gbps"], 1600.0)
          assert m["nominal_bottleneck_stage"] == "accelerator-injection"
          assert math.isclose(m["effective_path_bandwidth_gbps"], 1368.0)
          assert m["effective_bottleneck_stage"] == "accelerator-injection"

          assert math.isclose(m["nominal_serialization_seconds"], 0.00134217728)
          assert math.isclose(
              m["effective_serialization_seconds"],
              0.0015697979883040937,
          )
          assert math.isclose(m["path_fixed_latency_ns"], 750.0)
          assert math.isclose(
              m["p2p_transfer_lower_bound_seconds"],
              0.0015705479883040938,
          )
          assert r["unknowns"] == []
          print("fabric performance reference verified")
          PY

      - name: Build collective performance references
        run: |
          python scripts/build-collective-performance.py \
            --input examples/collectives/ring-allreduce-reference.yaml \
            --fabric-profile generated/executable/fabric-reference.json \
            --output generated/executable/collective-ring-allreduce-reference.json \
            --markdown-output system/derived/collective-ring-allreduce-reference.md

          python scripts/build-collective-performance.py \
            --input examples/collectives/tree-allreduce-explicit-reference.yaml \
            --fabric-profile generated/executable/fabric-reference.json \
            --output generated/executable/collective-tree-explicit-reference.json

          python scripts/build-collective-performance.py \
            --input examples/collectives/alltoall-explicit-reference.yaml \
            --output generated/executable/collective-alltoall-explicit-reference.json

      - name: Verify collective performance references
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          ring = json.loads(
              Path("generated/executable/collective-ring-allreduce-reference.json").read_text()
          )
          m = ring["metrics"]
          s = ring["sources"]

          assert ring["collective"] == "all-reduce"
          assert ring["algorithm"] == "ring"
          assert ring["participant_count"] == 8
          assert m["algorithm_steps"] == 14
          assert m["critical_path_bytes"] == 469_762_048
          assert math.isclose(m["algorithmic_traffic_factor"], 1.75)
          assert math.isclose(m["effective_bandwidth_gbps"], 1368.0)
          assert math.isclose(m["step_latency_ns"], 750.0)
          assert math.isclose(m["serialization_seconds"], 0.0027471464795321638)
          assert math.isclose(m["step_latency_seconds"], 0.0000105)
          assert math.isclose(
              m["collective_time_lower_bound_seconds"],
              0.002757646479532164,
          )
          assert s["steps_source"] == "derived-ring"
          assert s["critical_path_bytes_source"] == "derived-ring"
          assert s["effective_bandwidth_source"] == "fabric-profile-effective-path"
          assert s["step_latency_source"] == "fabric-profile-fixed-path"
          assert ring["unknowns"] == []

          tree = json.loads(
              Path("generated/executable/collective-tree-explicit-reference.json").read_text()
          )
          tm = tree["metrics"]
          ts = tree["sources"]
          assert tree["algorithm"] == "tree"
          assert tm["algorithm_steps"] == 6
          assert tm["critical_path_bytes"] == 536_870_912
          assert ts["steps_source"] == "explicit"
          assert ts["critical_path_bytes_source"] == "explicit"
          assert ts["effective_bandwidth_source"] == "fabric-profile-effective-path"

          a2a = json.loads(
              Path("generated/executable/collective-alltoall-explicit-reference.json").read_text()
          )
          am = a2a["metrics"]
          ass = a2a["sources"]
          assert a2a["collective"] == "all-to-all"
          assert a2a["algorithm"] == "direct"
          assert math.isclose(
              a2a["algorithm_details"]["uniform_network_send_bytes_per_rank"],
              234_881_024,
          )
          assert am["algorithm_steps"] == 1
          assert am["critical_path_bytes"] == 234_881_024
          assert math.isclose(am["effective_bandwidth_gbps"], 900.0)
          assert math.isclose(am["step_latency_ns"], 1200.0)
          assert ass["effective_bandwidth_source"] == "explicit-collective"
          assert ass["step_latency_source"] == "explicit"
          assert a2a["fabric_profile"] is None
          assert a2a["unknowns"] == []

          print("collective performance references verified")
          PY

      - name: Validate Chip Schema V0.2
        run: python scripts/validate-chip.py --root . --report generated/chip-validation.json

      - name: Validate repository schema and links
        run: python scripts/validate-repo.py --root . --report generated/validation.json

      - name: Build chip catalog and data-quality reports
        run: python scripts/build-chip-catalog.py --root . --output generated

      - name: Build interconnect comparison and health reports
        run: python scripts/build-interconnect-catalog.py --root . --output generated

      - name: Verify interconnect scope normalization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          records = {
              row["id"]: row
              for row in json.loads(Path("generated/interconnect-catalog.json").read_text())
          }

          def rates(node, scope):
              return [r for r in records[node]["rates"] if r["scope"] == scope]

          nvlink = rates("chip/NVIDIA/nvlink-5", "device")
          assert any(r["value"] == 1800 and r["unit"] == "GB/s" for r in nvlink)

          th6 = records["chip/Broadcom/th6-davisson-cpo"]
          assert th6["optical_packaging"] == "CPO"
          assert "optical" in th6["medium"]
          assert any(r["value"] == 102.4 and r["unit"] == "TB/s" for r in rates("chip/Broadcom/th6-davisson-cpo", "switch"))
          assert any(r["value"] == 6.4 and r["unit"] == "TB/s" for r in rates("chip/Broadcom/th6-davisson-cpo", "engine"))
          assert any(r["value"] == 200 and r["unit"] == "Gb/s" for r in rates("chip/Broadcom/th6-davisson-cpo", "link"))

          hi_one = records["chip/Huawei/hi-one-npo"]
          assert hi_one["optical_packaging"] == "NPO"
          assert any(r["value"] == 7.2 and r["unit"] == "TB/s" for r in rates("chip/Huawei/hi-one-npo", "engine"))

          ici = rates("chip/Google/tpu-ici", "device")
          assert len([r for r in ici if r["direction"] == "bidirectional"]) >= 3

          linkdevice = records["chip/Huawei/unifiedbus-linkdevice"]
          assert "optical" in linkdevice["medium"]
          assert any(r["value"] == 1.6 and r["unit"] == "Tb/s" for r in rates("chip/Huawei/unifiedbus-linkdevice", "port"))
          assert any(r["value"] == 280 and r["unit"] == "Tb/s" for r in rates("chip/Huawei/unifiedbus-linkdevice", "device"))
          assert any(x["field"] == "interconnect.rtt_us" and x["value"] == 2 for x in linkdevice["latency"])

          ubg = records["chip/Huawei/unifiedbus-ubg-switch"]
          assert any(x["field"] == "interconnect.radix" and x["value"] == 1024 for x in ubg["scale"])
          assert any(x["field"] == "interconnect.max_cluster_npus" and x["value"] == 1000000 for x in ubg["scale"])

          sf9300 = records["chip/Huawei/cloudengine-sf9300"]
          assert any(x["field"] == "interconnect.topology" for x in sf9300["topology"])

          xh9300 = records["chip/Huawei/cloudengine-xh9300-npo"]
          assert xh9300["optical_packaging"] == "NPO"
          assert any(r["value"] == 100 and r["unit"] == "TB/s" for r in rates("chip/Huawei/cloudengine-xh9300-npo", "switch"))
          assert any(r["value"] == 51.2 and r["unit"] == "TB/s" for r in rates("chip/Huawei/cloudengine-xh9300-npo", "switch"))
          assert any(r["value"] == 3.2 and r["unit"] == "TB/s" for r in rates("chip/Huawei/cloudengine-xh9300-npo", "engine"))

          nvlink6 = records["chip/NVIDIA/nvlink-6"]
          assert nvlink6["status"] == "announced"
          assert any(r["value"] == 3000 and r["unit"] == "GB/s" for r in rates("chip/NVIDIA/nvlink-6", "device"))
          assert any(r["value"] == 216 and r["unit"] == "TB/s" for r in rates("chip/NVIDIA/nvlink-6", "domain"))

          nvlink6_switch = records["chip/NVIDIA/nvlink-6-switch"]
          assert any(r["value"] == 3000 and r["unit"] == "GB/s" for r in rates("chip/NVIDIA/nvlink-6-switch", "device"))
          assert any(r["value"] == 216 and r["unit"] == "TB/s" for r in rates("chip/NVIDIA/nvlink-6-switch", "domain"))

          ualink2_phy = records["chip/UALink/ualink-200g-dlpl-2-0"]
          assert any(r["value"] == 200 and r["unit"] == "Gb/s" for r in rates("chip/UALink/ualink-200g-dlpl-2-0", "lane"))

          uec = records["chip/UEC/ultra-ethernet-1-0-3"]
          assert uec["status"] == "current-catalog"
          assert uec["object_class"] == "interconnect-standard"
          assert not uec["rates"]

          sue = records["chip/UEC/scale-up-transport-roadmap"]
          assert sue["status"] == "roadmap"
          assert not sue["rates"]

          for row in records.values():
              for rate in row["rates"]:
                  assert rate["value"] is not None
                  assert rate["scope"] in {"lane", "link", "port", "station", "device", "engine", "switch", "domain", "unknown"}

          comparison = Path("generated/interconnect-comparison.md").read_text()
          assert "unknown" in comparison, "missing facts must remain visibly unknown"

          print("interconnect normalization verified")
          PY

      - name: Build knowledge graph artifacts
        run: python scripts/build-knowledge-graph.py --root . --output generated

      - name: Enrich chip typed relations
        run: python scripts/enrich-knowledge-graph.py --generated generated

      - name: Upload graph audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-${{ github.sha }}
          path: generated
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch Quartz v5
        run: |
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git "$QUARTZ_DIR"
          cd "$QUARTZ_DIR"
          npm ci

      - name: Stage AI Infra content
        run: |
          rm -rf "$QUARTZ_DIR/content"
          mkdir -p "$QUARTZ_DIR/content/generated"

          cp 00-ai-infra-map.md "$QUARTZ_DIR/content/index.md"
          cp README.md "$QUARTZ_DIR/content/README.md"
          cp AGENTS.md "$QUARTZ_DIR/content/AGENTS.md"
          cp -R chip "$QUARTZ_DIR/content/chip"
          cp -R system "$QUARTZ_DIR/content/system"
          cp -R models "$QUARTZ_DIR/content/models"
          cp generated/graph-summary.md "$QUARTZ_DIR/content/generated/graph-summary.md"
          cp generated/chip-health.md "$QUARTZ_DIR/content/generated/chip-health.md"
          cp generated/chip-comparison.md "$QUARTZ_DIR/content/generated/chip-comparison.md"
          cp generated/interconnect-health.md "$QUARTZ_DIR/content/generated/interconnect-health.md"
          cp generated/interconnect-comparison.md "$QUARTZ_DIR/content/generated/interconnect-comparison.md"

          echo "Staged Markdown files: $(find "$QUARTZ_DIR/content" -type f -name '*.md' | wc -l)"

      - name: Configure Quartz
        working-directory: ${{ env.QUARTZ_DIR }}
        run: |
          cp quartz.config.default.yaml quartz.config.yaml
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import YAML from "yaml"

          const path = "quartz.config.yaml"
          const config = YAML.parse(fs.readFileSync(path, "utf8"))

          config.configuration.pageTitle = "AI Infra Knowledge Graph"
          config.configuration.pageTitleSuffix = ""
          config.configuration.locale = "zh-CN"
          config.configuration.baseUrl = process.env.SITE_BASE_URL

          for (const plugin of config.plugins ?? []) {
            const source = String(plugin.source ?? "")
            if (source.includes("footer")) {
              plugin.options ??= {}
              plugin.options.links = {
                "知识图谱探索器": "https://MarsChan8293.github.io/ai_infra_docs/graph-explorer/",
                GitHub: "https://github.com/MarsChan8293/ai_infra_docs",
              }
            }
            if (source.includes("graph")) {
              plugin.options ??= {}
              plugin.options.localGraph = {
                ...(plugin.options.localGraph ?? {}),
                depth: 1,
                scale: 1.1,
                focusOnHover: true,
              }
              plugin.options.globalGraph = {
                ...(plugin.options.globalGraph ?? {}),
                depth: 2,
                scale: 0.8,
                focusOnHover: true,
                enableRadial: true,
              }
            }
            if (source.includes("og-image") || source.includes("cname")) {
              plugin.enabled = false
            }
          }

          fs.writeFileSync(path, YAML.stringify(config))
          NODE

      - name: Build Quartz site
        working-directory: ${{ env.QUARTZ_DIR }}
        run: npx quartz build

      - name: Build focused graph explorer
        run: |
          python scripts/build-graph-explorer.py \
            --generated generated \
            --output "$QUARTZ_DIR/public/graph-explorer" \
            --base-path "/ai_infra_docs"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.QUARTZ_DIR }}/public

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error \
            --output /tmp/pages.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages setup required::Open Settings > Pages and set Source to GitHub Actions once, then run this workflow again."
            exit 0
          fi

          cat /tmp/pages.json
          echo "Unexpected GitHub Pages API status: $status"
          exit 1

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages setup required
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "Knowledge graph build is ready."
          echo "Enable GitHub Pages once at Settings > Pages > Build and deployment > Source > GitHub Actions."
          echo "Then use Actions > Build and Deploy AI Infra Knowledge Graph > Run workflow."
