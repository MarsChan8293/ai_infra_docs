name: Migrate Chip Schema V0.2

on:
  push:
    branches:
      - chip-schema-v02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: chip-schema-v02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Migrate all chip objects
        run: python scripts/migrate-chip-v0.2.py --root . --accessed 2026-09-16

      - name: Validate migrated chip objects
        run: python scripts/validate-chip.py --root . --report generated/chip-validation.json

      - name: Build chip data-quality reports
        run: python scripts/build-chip-catalog.py --root . --output generated --as-of 2026-09-16

      - name: Commit migrated Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chip
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "chore(chip): migrate objects to schema v0.2"
          git push origin HEAD:chip-schema-v02
